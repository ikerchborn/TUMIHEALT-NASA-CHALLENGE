<title>Body figure prototype</title>
<style>
:root{--bg:#050b17;--ink:#e2e8f0;--mut:#94a3b8;--cy:#22d3ee}
body{margin:0;background:radial-gradient(900px 600px at 50% 0%,#0b2036,#050b17);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:24px;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.layer{opacity:.28;transition:opacity .25s} #L-musculo{opacity:.14}
svg[data-sel] .layer{opacity:.08} svg[data-sel="musculo"] #L-musculo,svg[data-sel="blood"] #L-blood,svg[data-sel="heart"] #L-heart,svg[data-sel="sleep"] #L-sleep{opacity:1;filter:url(#glow)}
.hot{cursor:pointer} .hot .dot{fill:var(--cy)} .hot .ring{fill:none;stroke:var(--cy);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-out infinite}
@keyframes p{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.hot .ring{animation:none} .layer{transition:none}}
.leaders path{stroke:#38bdf8;stroke-opacity:.35} .leaders path.on{stroke-opacity:.95}
.lab{cursor:pointer} .lab rect{fill:#0b1b2c;stroke:#38bdf8;stroke-opacity:.45} .lab text{fill:#e2e8f0;font:600 14px system-ui} .lab .sub{fill:#94a3b8;font:12px system-ui}
.lab.on rect,.lab:focus rect{fill:#0e3a4f;stroke:#22d3ee;stroke-opacity:1;stroke-width:2} .lab:focus{outline:none}
.panel{background:#0b1b2c;border:1px solid #1e3a52;border-radius:14px;padding:20px} h2{margin:.2rem 0 .4rem;font-size:22px} .mut{color:var(--mut)}
.btn{display:inline-block;margin:6px 8px 0 0;padding:9px 14px;border-radius:10px;background:#0e7490;color:#fff;font-weight:600;border:0} .btn.sec{background:transparent;border:1px solid #38bdf8;color:#e2e8f0}
</style></head><body><div class="wrap"><div>

<div class="panel" id="panel"><h2>Body Explorer</h2><p class="mut">Select a highlighted point or a label to see what TUMI-HEALT monitors there.</p></div></div>
<script>
const info={
 sleep:["Sleep & recovery","Rest and recovery are driven by the brain. Altered light cycles in space can disrupt sleep.","Monitored: sleep duration, latency, quality (imported records + check-in).","3 records"],
 heart:["Heart","The heart pumps blood to the whole body. Microgravity and radiation can change how it performs.","Monitored: heart rate, blood pressure.","12 records"],
 blood:["Blood","Blood carries oxygen, immune cells and nutrients. Blood tests show how the body adapts to spaceflight.","Monitored: CBC / CMP biomarkers, glucose.","No data yet"],
 musculo:["Bones & muscles","Bones and muscles lose mass in low gravity. Exercise countermeasures help.","Educational only. TUMI-HEALT does not monitor this system.","Educational"]
};
const svg=document.getElementById('fig'),panel=document.getElementById('panel');
function sel(k){svg.dataset.sel=k;
 svg.querySelectorAll('.lab').forEach(e=>e.classList.toggle('on',e.dataset.system===k));
 svg.querySelectorAll('.leaders path').forEach(e=>e.classList.toggle('on',e.dataset.system===k));
 const i=info[k];panel.innerHTML='<h2>'+i[0]+'</h2><p>'+i[1]+'</p><p class="mut">'+i[2]+'</p><p class="mut">Status: '+i[3]+'</p>'+(k==='musculo'?'':'<a class="btn">Import data</a><a class="btn sec">View trend</a>')}
svg.querySelectorAll('.hot,.lab').forEach(e=>{e.addEventListener('click',()=>sel(e.dataset.system));e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();sel(e.dataset.system)}})});
svg.querySelectorAll('.hot').forEach(e=>{e.setAttribute('tabindex','0');e.setAttribute('role','button');e.setAttribute('aria-label',info[e.dataset.system][0])});
if(location.hash.slice(1)&&info[location.hash.slice(1)])sel(location.hash.slice(1));
</script></body></html>
